<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CricketMarker</title>

<link rel="stylesheet" href="css/styles.css">

<link rel="manifest" href="manifest.json">

</head>


<body>


<header>

<h1>🏏 CricketMarker</h1>

<p>Digital Cricket Pitch Alignment Assistant</p>

</header>



<section id="camera-container">


<video 
id="camera"
autoplay
playsinline>
</video>


<canvas id="overlay"></canvas>


<div id="camera-message">

Camera inactive

</div>


</section>




<section id="controls">


<button id="startCamera">

Start Camera

</button>


<button id="stopCamera">

Stop Camera

</button>


<button id="lockLine">

Lock Centre Line

</button>



<div id="status">

Waiting

</div>


</section>



<script type="module" src="js/app.js"></script>


</body>

</html>
