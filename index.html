<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cricket Pitch Marker</title>

<link rel="stylesheet" href="css/styles.css">

<link rel="manifest" href="manifest.json">

</head>


<body>


<header>

<h1>🏏 Cricket Pitch Marker</h1>

<p>Digital Cricket Pitch Alignment Assistant</p>

</header>



<section id="camera-container">


<video 
id="camera"
autoplay
playsinline>
</video>


<canvas id="overlay"></canvas>


<div id="camera-message">

Camera inactive

</div>


</section>




<section id="controls">


<button id="startCamera">

Start Camera

</button>


<button id="stopCamera">

Stop Camera

</button>


<button id="enableSensors">

Enable Phone Sensors

</button>


<button id="calibrate">

Calibrate Pitch Line

</button>

<button id="setPitch">
Set Pitch Direction
</button>

<button id="startMarker">

Start Marker Tracking

</button>



<div id="status">

Waiting

</div>


</section>


<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script type="module" src="js/app.js"></script>


</body>

</html>
